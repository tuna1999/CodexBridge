services:
  codex-bridge:
    build:
      context: .
      dockerfile: Containerfile
      args:
        RUST_VERSION: "1.88"
    image: localhost/codex-bridge:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${MCP_PORT:-3000}:3000"
    environment:
      MCP_BIND: "0.0.0.0:3000"
      RUST_LOG: "${RUST_LOG:-warn}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
    volumes:
      - codex-bridge-workspace:/workspace
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    security_opt:
      - no-new-privileges
      # Avoid relabeling the live rootless service socket on SELinux hosts.
      - label=disable
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codex-bridge-workspace:
